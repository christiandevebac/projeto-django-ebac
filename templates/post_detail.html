{% extends 'base.html' %}
{% block content %}
<div class="row">
    <div class="col-md-8 card mb-4 mt-3 left top shadow-sm">
        <div class="card-body">
            <h1>{{ post.title }}</h1>
            <p class="text-muted">{{ post.author }} | {{ post.created_on }}</p>
            <p class="card-text">{{ post.content|linebreaks }}</p>
            <a href="{% url 'home' %}" class="btn btn-secondary mt-3">&larr; Voltar</a>
        </div>
    </div>
</div>
{% endblock content %}
